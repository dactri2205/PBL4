services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: anviet
      PGUSER: anviet_app
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - portal

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    environment:
      TLS_HOSTNAME: ${TLS_HOSTNAME:-10.8.0.1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_LOCAL_PORT:-18080}:443"
    volumes:
      - tls_certs:/etc/nginx/certs
    networks:
      - portal

  db:
    build:
      context: ./database
    restart: unless-stopped
    environment:
      POSTGRES_DB: anviet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_USER: anviet_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anviet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portal

  migrate:
    build:
      context: .
      dockerfile: database/migrator.Dockerfile
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: anviet
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portal

networks:
  portal:
    driver: bridge

volumes:
  postgres_data:
  tls_certs:
